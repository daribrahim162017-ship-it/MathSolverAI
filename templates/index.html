<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Math Solver AI</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
<script>window.MathJax={tex:{inlineMath:[['\\(','\\)'],['$','$']],displayMath:[['\\[','\\]'],['$$','$$']]}};</script>
<script defer src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script><script defer src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js"></script><script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script></head>
<body><div class="app"><aside class="sidebar"><div class="brand"><span class="brand-icon">∑</span><b>Math Solver AI</b></div><button id="newChat" class="new-chat">＋　New chat</button><div class="sidebar-scroll"><div class="section-title">PINNED</div><div id="pinnedList"></div><div class="section-title">CHATS</div><div id="chatList"></div></div><div class="profile"><span class="avatar">M</span> Math Student</div></aside>
<main class="main"><header class="main-header"><h1 id="chatTitle">New Math Chat</h1><p>Clear, step-by-step mathematics</p></header><section id="chat" class="chat"><div id="welcome" class="welcome"><div class="robot">🤖</div><h2>Let's solve math together!</h2><p>Ask a question or upload a photo of your math problem.</p><div class="examples"><button data-q="25 + 37">25 + 37</button><button data-q="3/4 + 5/6">3/4 + 5/6</button><button data-q="2x + 5 = 15">2x + 5 = 15</button><button data-q="x^2 - 9 = 0">x² − 9 = 0</button></div></div><div id="messages"></div></section>
<div class="input-area"><div id="pendingImage" class="pending-image" hidden><img id="preview" alt="Selected question image"><button id="removeImage" type="button">×</button></div><div class="input-box"><input id="imageInput" type="file" accept="image/jpeg,image/png,image/webp" hidden><button id="upload" type="button" title="Upload image">📷</button><textarea id="question" rows="1" placeholder="Ask a math question..."></textarea><button id="send" type="button">➤</button></div><small>📷 Upload a question • Enter to solve</small></div></main></div>
<script>
(()=>{'use strict';const KEY='mathSolverChats';let chats=[];try{chats=JSON.parse(localStorage.getItem(KEY)||'[]')}catch(e){}if(!Array.isArray(chats))chats=[];let activeId=chats[0]?.id||null,selectedImage=null,busy=false;const $=id=>document.getElementById(id);const messages=$('messages'),chat=$('chat'),welcome=$('welcome'),input=$('question'),file=$('imageInput');
function id(){return Date.now().toString()+Math.random().toString(16).slice(2,7)}function save(){try{localStorage.setItem(KEY,JSON.stringify(chats))}catch(e){notice('Browser storage is full. Please remove an old large image from a chat.')}}function current(){return chats.find(c=>c.id===activeId)}function ensure(){let c=current();if(!c){c={id:id(),title:'New Math Chat',pinned:false,messages:[],lastImage:null};chats.unshift(c);activeId=c.id;save()}if(!Array.isArray(c.messages))c.messages=[];return c}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function md(s){let h=window.marked?marked.parse(String(s||'')):esc(s).replace(/\n/g,'<br>');return window.DOMPurify?DOMPurify.sanitize(h):h}function typeset(el){if(window.MathJax?.typesetPromise)MathJax.typesetPromise([el]).catch(()=>{})}function notice(t){let n=document.createElement('div');n.className='notice';n.textContent=t;messages.appendChild(n);chat.scrollTop=chat.scrollHeight}
function sidebar(){for(const [name,filter] of [['pinnedList',c=>c.pinned],['chatList',c=>!c.pinned]]){const box=$(name);box.innerHTML='';chats.filter(filter).forEach(c=>{let row=document.createElement('div');row.className='chat-row'+(c.id===activeId?' active':'');row.innerHTML=`<button class="chat-open"><span>○</span><span class="chat-title">${esc(c.title||'New Math Chat')}</span></button><button class="pin" title="Pin or unpin">${c.pinned?'📌':'☆'}</button><button class="delete" title="Delete chat">×</button>`;row.querySelector('.chat-open').onclick=()=>load(c.id);row.querySelector('.pin').onclick=()=>{c.pinned=!c.pinned;save();sidebar()};row.querySelector('.delete').onclick=()=>{if(!confirm('Delete this chat?'))return;chats=chats.filter(x=>x.id!==c.id);activeId=chats[0]?.id||null;if(!activeId)newChat();else load(activeId);save();sidebar()};box.appendChild(row)})}}
function addBubble(m){let wrap=document.createElement('article');wrap.className='message '+(m.role==='user'?'user-message':'assistant-message');if(m.image){let im=document.createElement('img');im.className='message-image';im.src=m.image;im.alt='Uploaded mathematics question';im.onclick=()=>{let ov=document.createElement('div');ov.className='lightbox';let full=document.createElement('img');full.src=m.image;let close=document.createElement('button');close.textContent='×';ov.append(close,full);ov.onclick=()=>ov.remove();document.body.appendChild(ov)};wrap.appendChild(im)}let body=document.createElement('div');body.className='message-content';if(m.role==='assistant')body.innerHTML=md(m.content);else body.textContent=m.content||'Please solve the uploaded question.';wrap.appendChild(body);messages.appendChild(wrap);if(m.role==='assistant')typeset(wrap)}
function render(){messages.innerHTML='';let c=ensure();c.messages.forEach(addBubble);welcome.hidden=c.messages.length>0;$('chatTitle').textContent=c.title||'New Math Chat';chat.scrollTop=chat.scrollHeight}
function load(chatId){activeId=chatId;selectedImage=null;$('pendingImage').hidden=true;file.value='';render();sidebar();save()}function newChat(){let c={id:id(),title:'New Math Chat',pinned:false,messages:[],lastImage:null};chats.unshift(c);activeId=c.id;selectedImage=null;input.value='';file.value='';$('pendingImage').hidden=true;save();render();sidebar();input.focus()}
async function send(){if(busy)return;let text=input.value.trim(),c=ensure();if(!text&&!selectedImage)return;busy=true;$('send').disabled=true;let attached=selectedImage||c.lastImage||null;c.messages.push({role:'user',content:text,image:selectedImage||null});if(selectedImage)c.lastImage=selectedImage;if(c.title==='New Math Chat')c.title=(text||'Uploaded math question').replace(/\s+/g,' ').slice(0,42);selectedImage=null;$('pendingImage').hidden=true;file.value='';input.value='';input.style.height='auto';save();render();sidebar();let thinking=document.createElement('div');thinking.className='thinking';thinking.textContent='Thinking through the steps…';messages.appendChild(thinking);chat.scrollTop=chat.scrollHeight;let history=c.messages.slice(-12).map(m=>({role:m.role,content:m.content||(m.image?'The student uploaded a mathematics question image.':'')}));try{let r=await fetch('/solve',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({question:text,image:attached,history})});let data=await r.json();thinking.remove();if(!r.ok||data.error)throw new Error(data.error||'The request failed.');c.messages.push({role:'assistant',content:data.answer||'No answer was returned.'})}catch(e){thinking.remove();c.messages.push({role:'assistant',content:'**I could not complete that request.**\n\n'+(e.message||'Please try again.')})}finally{busy=false;$('send').disabled=false;save();render();sidebar();input.focus()}}
function pickImage(f){if(!f)return;if(!['image/jpeg','image/png','image/webp'].includes(f.type)){notice('Please choose a JPG, PNG, or WebP image.');file.value='';return}if(f.size>10*1024*1024){notice('Please choose an image smaller than 10 MB.');file.value='';return}let reader=new FileReader();reader.onload=()=>{selectedImage=reader.result;$('preview').src=selectedImage;$('pendingImage').hidden=false};reader.onerror=()=>notice('Could not read that image. Please try again.');reader.readAsDataURL(f)}
$('newChat').onclick=newChat;$('upload').onclick=()=>file.click();file.onchange=()=>pickImage(file.files[0]);$('removeImage').onclick=()=>{selectedImage=null;file.value='';$('pendingImage').hidden=true};$('send').onclick=send;input.onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}};input.oninput=()=>{input.style.height='auto';input.style.height=Math.min(input.scrollHeight,150)+'px'};document.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>{input.value=b.dataset.q;send()});if(!activeId)newChat();else{load(activeId)}
})();
</script></body></html>
